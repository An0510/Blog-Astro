name: Deploy to Nginx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-nginx
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Publish site branch
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            echo "::error::dist/index.html was not produced"
            exit 1
          fi
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          site=$(mktemp -d)
          cp -a dist/. "$site/"
          git reset --hard
          git clean -fdx
          git switch --orphan site-tmp
          git rm -rf --ignore-unmatch --quiet .
          git clean -fdx
          cp -a "$site"/. .
          rm -rf "$site"
          git add -Af
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy site"
          git push --force origin HEAD:refs/heads/site
