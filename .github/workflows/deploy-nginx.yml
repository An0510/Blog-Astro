name: Deploy to Nginx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-nginx
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Publish site branch
        run: |
          set -euo pipefail
          test -f dist/index.html
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          header=$(git config --get http.https://github.com/.extraheader)
          tmp=$(mktemp -d)
          cp -a dist/. "$tmp/"
          cd "$tmp"
          git init -b site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy site"
          git config http.https://github.com/.extraheader "$header"
          if ! git -c http.https://github.com/.extraheader="$header" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site > /tmp/push.out 2>&1; then
            {
              echo "### Publish failed"
              echo '```'
              cat /tmp/push.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
